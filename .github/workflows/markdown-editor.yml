name: Markdown editor

on:
  pull_request:
    paths:
      - '.github/workflows/markdown-editor.yml'
      - 'scripts/check-markdown.py'
      - 'scripts/tests/test_check_markdown.py'
      - 'scripts/prepare-slint.py'
      - 'patches/slint/**'
      - 'prototypes/slint-source-highlighting/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/markdown-editor.yml'
      - 'scripts/check-markdown.py'
      - 'scripts/tests/test_check_markdown.py'
      - 'scripts/prepare-slint.py'
      - 'patches/slint/**'
      - 'prototypes/slint-source-highlighting/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    name: Headless Skia (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      - name: Install Linux build and font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo timeout 600 apt-get update
          sudo timeout 600 apt-get install -y \
            build-essential clang cmake ninja-build pkg-config patch \
            libfontconfig-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev fonts-dejavu-core fonts-noto-cjk
      - name: Expose GNU patch to Windows Python
        if: runner.os == 'Windows'
        run: |
          cygpath -w /usr/bin >> "$GITHUB_PATH"
          patch --version
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Verify failure propagation
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts/tests -p test_check_markdown.py
      - name: Run native editor checks
        run: python scripts/check-markdown.py
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markdown-editor-${{ matrix.os }}
          path: target/markdown-validation/
          retention-days: 14
          if-no-files-found: warn
