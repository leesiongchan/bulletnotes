# Release and packaging CLIs used by CI; Rust itself stays pinned in rust-toolchain.toml.
[tools]
git-cliff = "2.14.2"
# cargo-packager 0.11.8's locked dependencies carry RustSec advisories that main has fixed but not yet released.
# mise builds this audited commit with its own Cargo.lock; move to the next release once it ships.
"cargo:https://github.com/crabnebula-dev/cargo-packager" = { version = "rev:7197bff5110e33d54691d4788fd55c0edd73aa11", crate = "cargo-packager" }
"github:EmbarkStudios/cargo-about" = "0.9.2"
