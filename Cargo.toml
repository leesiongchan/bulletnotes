[package]
name = "bulletnotes"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[features]
default = []
protocol-validation = []

[dependencies]
pulldown-cmark = { version = "=0.13.4", default-features = false }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "json", "registry"] }
tracing-appender = "=0.2.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
jiff = "=0.2.38"
gix-merge = { version = "=0.22.0", default-features = false, features = ["sha256"] }
gix-imara-diff = "=0.3.1"
unicode-segmentation = "=1.13.3"
sha2 = "=0.11.1"
url = "=2.5.8"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "unstable-wgpu-29", "accessibility", "compat-1-18", "raw-window-handle-06", "system-tray"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
rfd = { version = "=0.17.2", default-features = false }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder", "NSApplication", "NSEvent", "NSButton", "NSControl", "NSScreen", "NSAppearance", "NSWorkspace", "NSRunningApplication", "NSAccessibility", "NSAnimation", "NSAnimationContext", "libc", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSProcessInfo", "NSFileManager", "NSPathUtilities", "NSURL", "NSArray", "NSError", "NSGeometry", "NSNotification", "NSDistributedNotificationCenter", "NSAppleEventManager", "NSAppleEventDescriptor", "NSOperation", "NSKeyValueObserving", "NSDictionary", "block2"] }
raw-window-handle = "=0.6.2"
block2 = "=0.6.2"
global-hotkey = "=0.9.0"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-core = "=1.18.1"
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-skia"] }
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "json"] }

[lints.clippy]
all = "warn"

[[test]]
name = "protocol_contract"
required-features = ["protocol-validation"]

[[test]]
name = "compatibility_probe"
required-features = ["protocol-validation"]

[[test]]
name = "connection_security"
required-features = ["protocol-validation"]

[[test]]
name = "sync_lifecycle"
required-features = ["protocol-validation"]

[[bench]]
name = "interaction"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
i-slint-common = { git = "https://github.com/leesiongchan/slint", rev = "20e807141ad55c2a249b3c6756ce157a4fb0033d" }
i-slint-compiler = { git = "https://github.com/leesiongchan/slint", rev = "20e807141ad55c2a249b3c6756ce157a4fb0033d" }
i-slint-core = { git = "https://github.com/leesiongchan/slint", rev = "20e807141ad55c2a249b3c6756ce157a4fb0033d" }
i-slint-backend-winit = { git = "https://github.com/leesiongchan/slint", rev = "20e807141ad55c2a249b3c6756ce157a4fb0033d" }
i-slint-core-macros = { git = "https://github.com/leesiongchan/slint", rev = "20e807141ad55c2a249b3c6756ce157a4fb0033d" }
i-slint-renderer-skia = { git = "https://github.com/leesiongchan/slint", rev = "20e807141ad55c2a249b3c6756ce157a4fb0033d" }
vtable = { git = "https://github.com/leesiongchan/slint", rev = "20e807141ad55c2a249b3c6756ce157a4fb0033d" }
vtable-macro = { git = "https://github.com/leesiongchan/slint", rev = "20e807141ad55c2a249b3c6756ce157a4fb0033d" }
const-field-offset = { git = "https://github.com/leesiongchan/slint", rev = "20e807141ad55c2a249b3c6756ce157a4fb0033d" }
const-field-offset-macro = { git = "https://github.com/leesiongchan/slint", rev = "20e807141ad55c2a249b3c6756ce157a4fb0033d" }
# dpi stays on crates.io: the winit fork depends on the registry release, like the published crate.
winit = { git = "https://github.com/leesiongchan/winit", rev = "0d819196d0a8ac461d5e57d056a777cd60aff0ec" }
