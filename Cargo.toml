[package]
name = "bulletnotes"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[features]
default = []
protocol-validation = []
native-validation = ["objc2-app-kit/NSVisualEffectView", "objc2-app-kit/NSColor", "objc2-app-kit/NSGraphics", "objc2-app-kit/NSApplication", "objc2-app-kit/NSWorkspace", "objc2-app-kit/NSRunningApplication", "objc2-app-kit/NSButton", "objc2-app-kit/NSControl", "objc2-app-kit/NSEvent", "objc2-app-kit/NSGraphicsContext", "objc2-foundation/NSGeometry", "objc2-app-kit/block2"]
renderer-review = ["slint/renderer-skia-opengl"]

[dependencies]
pulldown-cmark = { version = "=0.13.4", default-features = false }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "json", "registry"] }
tracing-appender = "=0.2.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
jiff = "=0.2.38"
gix-merge = { version = "=0.22.0", default-features = false, features = ["sha256"] }
gix-imara-diff = "=0.3.1"
unicode-segmentation = "=1.13.3"
sha2 = "=0.11.1"
url = "=2.5.8"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "unstable-wgpu-29", "accessibility", "compat-1-18", "raw-window-handle-06", "system-tray"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
rfd = { version = "=0.17.2", default-features = false }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder", "NSApplication", "NSEvent", "NSButton", "NSControl", "NSScreen", "NSAppearance", "NSWorkspace", "NSRunningApplication", "NSAccessibility", "NSAnimation", "NSAnimationContext", "libc", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSProcessInfo", "NSFileManager", "NSPathUtilities", "NSURL", "NSArray", "NSError", "NSGeometry", "NSNotification", "NSDistributedNotificationCenter", "NSAppleEventManager", "NSAppleEventDescriptor", "NSOperation", "NSKeyValueObserving", "NSDictionary", "block2"] }
raw-window-handle = "=0.6.2"
block2 = "=0.6.2"
global-hotkey = "=0.9.0"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-core = "=1.18.1"
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-skia"] }
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "json"] }
png = "=0.18.1"

[lints.clippy]
all = "warn"

[[test]]
name = "protocol_contract"
required-features = ["protocol-validation"]

[[test]]
name = "compatibility_probe"
required-features = ["protocol-validation"]

[[test]]
name = "connection_security"
required-features = ["protocol-validation"]

[[test]]
name = "sync_lifecycle"
required-features = ["protocol-validation"]

[[example]]
name = "sync_review"
required-features = ["native-validation", "protocol-validation"]

[[example]]
name = "recovery_review"
required-features = ["native-validation", "protocol-validation"]

[[bench]]
name = "interaction"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[example]]
name = "renderer_review"
required-features = ["native-validation", "renderer-review"]

[[example]]
name = "editor_reconciliation_review"
required-features = ["native-validation"]

[patch.crates-io]
i-slint-common = { path = "target/slint-source-highlighting/crates/i-slint-common-1.18.1" }
i-slint-compiler = { path = "target/slint-source-highlighting/crates/i-slint-compiler-1.18.1" }
i-slint-core = { path = "target/slint-source-highlighting/crates/i-slint-core-1.18.1" }
i-slint-backend-winit = { path = "target/slint-source-highlighting/crates/i-slint-backend-winit-1.18.1" }
winit = { path = "target/slint-source-highlighting/crates/winit-0.30.13" }
