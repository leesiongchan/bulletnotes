[package]
name = "bulletnotes"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[features]
default = []
native-validation = ["objc2-app-kit/NSVisualEffectView", "objc2-app-kit/NSColor", "objc2-app-kit/NSGraphics", "dep:global-hotkey", "objc2-app-kit/NSApplication", "objc2-app-kit/NSWorkspace", "objc2-app-kit/NSRunningApplication"]
probe-skia = ["slint/renderer-skia"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
uuid = { version = "=1.28.0", features = ["v4"] }
jiff = "=0.2.38"
url = "=2.5.8"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-18", "raw-window-handle-06", "system-tray"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSProcessInfo"] }
raw-window-handle = "=0.6.2"
global-hotkey = { version = "=0.9.0", optional = true }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
png = "=0.18.1"
tempfile = "=3.27.0"

[lints.clippy]
all = "warn"
