# git-cliff computes release versions and notes; see docs/build.md.
[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% if commit.breaking and commit.breaking_description != commit.message %}
{{ "  - " }}{{ commit.breaking_description | indent(prefix="    ") }}\
{% endif %}\
{% endfor %}
{% else %}
Initial release.
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Admin-bypass pushes skip the PR lint; a stray "fix ..." commit must not cut a release.
filter_unconventional = true
# The PR commit lint uses its own strict config; releases must not fail on stray commits.
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { field = "breaking", pattern = "true", group = "<!-- 3 -->Breaking changes" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
# A breaking change on 0.x must not silently declare 1.0.
breaking_always_bump_major = false
initial_tag = "v0.1.0"
